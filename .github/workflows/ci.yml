name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Node.js 22 / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Show runtime versions
        run: |
          node --version
          npm --version
          python3 --version

      # The project uses only Node.js and Python standard libraries:
      # there are no dependencies or lockfiles to install/cache.
      - name: Build standalone Worker
        run: npm run build

      - name: Run existing tests
        run: npm test

      - name: Validate deployment artifact
        run: npm run validate

      - name: Check generated files match source
        run: |
          npm run check:generated
          cmp worker/index.js dist/server/index.js
          cmp .openai/hosting.json dist/.openai/hosting.json
